name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements/local.txt
      - run: ruff check .
      - run: python manage.py makemigrations --check --dry-run
      - run: python -m pytest -q

  frontend-org-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-org-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-org-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  frontend-super-admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend-super-admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend-super-admin/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx expo-doctor
      - run: npx expo export --platform android
