# Render Blueprint for SWAMS — see docs/01-SYSTEM-ARCHITECTURE.md §9.
#
# Database and file storage are NOT managed by Render — they live on
# Supabase (Postgres + Storage), so DATABASE_URL/SUPABASE_* are set
# manually per environment in the Render dashboard (sync: false below)
# rather than provisioned here.
#
# swams-api, swams-worker, and swams-beat all load the same Django settings
# module and must share one DJANGO_SECRET_KEY (it's also Django's signing
# key for password-reset tokens etc.) — so all three env vars live in one
# envVarGroup rather than being generated/entered separately per service,
# which would silently give each process a different key.

services:
  # --- Backend API (Django + DRF + Gunicorn) ---
  - name: swams-api
    type: web
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements/production.txt && python manage.py collectstatic --noinput"
    preDeployCommand: "python manage.py migrate"
    startCommand: "gunicorn core.wsgi:application"
    healthCheckPath: /api/v1/health/
    envVars:
      - fromGroup: swams-shared

  # --- Celery worker (notifications, reports, exports) ---
  - name: swams-worker
    type: worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements/production.txt"
    startCommand: "celery -A core worker --loglevel=info"
    envVars:
      - fromGroup: swams-shared

  # --- Celery beat (subscription-expiry checks, scheduled reports) ---
  - name: swams-beat
    type: worker
    runtime: python
    plan: starter
    rootDir: backend
    buildCommand: "pip install -r requirements/production.txt"
    startCommand: "celery -A core beat --loglevel=info"
    envVars:
      - fromGroup: swams-shared

  # --- Redis (Celery broker/result backend + app-level caching) ---
  - name: swams-redis
    type: keyvalue
    plan: starter
    ipAllowList: []

  # --- Organization Admin Web ---
  - name: swams-org-admin
    type: web
    runtime: static
    rootDir: frontend-org-admin
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  # --- Super Admin Web ---
  - name: swams-super-admin
    type: web
    runtime: static
    rootDir: frontend-super-admin
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

envVarGroups:
  - name: swams-shared
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: core.settings.production
      - key: DJANGO_SECRET_KEY
        sync: false
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_CONN_MAX_AGE
        value: "0"
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: swams-redis
          property: connectionString
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_BUCKET_PROFILE_PICTURES
        value: profile-pictures
      - key: SUPABASE_BUCKET_ORG_LOGOS
        value: org-logos
      - key: SUPABASE_BUCKET_DOCUMENTS
        value: documents
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        value: no-reply@swams.app
      - key: SMS_API_KEY
        sync: false
